<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer shadow background -->
  <rect x="6" y="6" width="52" height="52" rx="4" fill="#0A0A0A" />
  <!-- Main Head Container -->
  <rect x="4" y="4" width="52" height="52" rx="4" fill="#E8E8E8" stroke="#0A0A0A" stroke-width="4" />
  <!-- Top Antenna -->
  <rect x="28" y="-1" width="8" height="6" fill="#FF2D00" stroke="#0A0A0A" stroke-width="2" />
  <circle cx="32" cy="-3" r="3" fill="#0033FF" stroke="#0A0A0A" stroke-width="2" />
  <!-- Side Ears -->
  <rect x="0" y="24" width="5" height="12" rx="1" fill="#FF2D00" stroke="#0A0A0A" stroke-width="2" />
  <rect x="59" y="24" width="5" height="12" rx="1" fill="#FF2D00" stroke="#0A0A0A" stroke-width="2" />
  <!-- Visor / Eye Display -->
  <rect x="10" y="14" width="44" height="22" rx="2" fill="#0A0A0A" />
  <!-- Left Eye -->
  <rect x="15" y="18" width="12" height="14" rx="2" fill="#FF2D00" />
  <rect x="20" y="22" width="5" height="6" fill="#FFFFFF" />
  <!-- Right Eye -->
  <rect x="37" y="18" width="12" height="14" rx="2" fill="#FF2D00" />
  <rect x="42" y="22" width="5" height="6" fill="#FFFFFF" />
  <!-- Mouth / Code Shift Chevron -->
  <path d="M 20 44 L 27 48 L 20 52" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="33" y1="52" x2="44" y2="52" stroke="#FF2D00" stroke-width="3" stroke-linecap="round" />
</svg>
